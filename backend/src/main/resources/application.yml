spring:
  application:
    name: ajg-erp-research

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/ajg_erp_research}
    username: ${DB_USERNAME:ajg_erp_app}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080